<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MoodTraker</title>
<style>
  :root { --bg: #FBF8F3; --surface: #FFFFFF; --ink: #39352E; --muted: #8B8479; --line: #E3DCD1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17150F; --surface: #201D16; --ink: #ECE5D9; --muted: #9C9486; --line: #3A352B; }
  }
  * { box-sizing: border-box; }
  /* Sin esto, el display de .stores y .stores a gana al atributo hidden. */
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 40px 20px; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 420px; width: 100%; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 28px; }
  .stores { display: flex; flex-direction: column; gap: 10px; }
  .stores a {
    display: block; text-align: center; padding: 14px; border-radius: 26px; text-decoration: none;
    font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  }
  .home { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="text"></p>
  <div class="stores" id="stores" hidden>
    <a id="play" href="https://play.google.com/store/apps/details?id=com.baltajmn.mood">Google Play</a>
    <a id="apple" href="https://apps.apple.com/app/id6819302341">App Store</a>
  </div>
</main>
<script>
  // GitHub Pages sirve esta pagina para cualquier ruta que no conoce, asi que es tambien la de los
  // enlaces de amistad (/f/<codigo>): con la app instalada el enlace no llega aqui, abre la app. Sin
  // ella, cada movil va a su tienda: Play en Android, la App Store en iPhone y iPad. En un ordenador
  // salen las dos. /get es el enlace que lleva la imagen compartida desde la app: mismo reparto, con la
  // campana marcada para ver en las dos consolas cuanto trae.
  var PLAY = "https://play.google.com/store/apps/details?id=com.baltajmn.mood";
  var APPLE = "https://apps.apple.com/app/id6819302341";
  var T = {
    en: ["See how your friends are doing today on MoodTraker", "Install MoodTraker, then open this link again.", "This page does not exist.", "Your year in colours", "A mood tracker, one tap a day. Free on Android and iPhone."],
    es: ["Mira cómo están hoy tus amigos en MoodTraker", "Instala MoodTraker y vuelve a abrir este enlace.", "Esta página no existe.", "Tu año en colores", "Tu estado de ánimo con un toque al día. Gratis en Android y iPhone."],
    pt: ["Veja como seus amigos estão hoje no MoodTraker", "Instale o MoodTraker e abra este link de novo.", "Esta página não existe.", "Seu ano em cores", "Seu humor com um toque por dia. Grátis no Android e no iPhone."],
    de: ["Sieh, wie es deinen Freunden heute geht, mit MoodTraker", "Installiere MoodTraker und öffne diesen Link dann noch einmal.", "Diese Seite gibt es nicht.", "Dein Jahr in Farben", "Deine Stimmung mit einem Tippen am Tag. Kostenlos für Android und iPhone."],
    fr: ["Vois comment vont tes amis aujourd'hui sur MoodTraker", "Installe MoodTraker, puis rouvre ce lien.", "Cette page n'existe pas.", "Ton année en couleurs", "Ton humeur en un appui par jour. Gratuit sur Android et iPhone."]
  };
  var lang = (navigator.language || "en").slice(0, 2);
  var t = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : "en";
  var link = /^\/f\/[0-9a-fA-F]{10}\/?$/.test(location.pathname);
  if (/^\/get\/?$/.test(location.pathname)) {
    PLAY += "&referrer=utm_source%3Dmood-share%26utm_medium%3Dcard";
    APPLE = "https://apps.apple.com/app/apple-store/id6819302341?pt=129564006&ct=mood-share&mt=8";
    t = [t[3], t[4]];
    link = true;
  }
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  // iPadOS pide el sitio de escritorio: se hace pasar por un Mac, pero con pantalla tactil.
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

  function show(title, text, play, apple) {
    document.getElementById("title").textContent = title;
    document.getElementById("text").innerHTML = text;
    document.getElementById("play").href = PLAY;
    document.getElementById("apple").href = APPLE;
    document.getElementById("play").hidden = !play;
    document.getElementById("apple").hidden = !apple;
    document.getElementById("stores").hidden = !(play || apple);
  }

  if (!link) {
    show(t[2], '<a class="home" href="/">mood.baltajmn.dev</a>', false, false);
  } else if (android) {
    show(t[0], t[1], true, false);
    location.replace(PLAY);
  } else if (ios) {
    show(t[0], t[1], false, true);
    location.replace(APPLE);
  } else {
    show(t[0], t[1], true, true);
  }
</script>
</body>
</html>
